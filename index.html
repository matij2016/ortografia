<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miodowa Ortografia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game">
    <h1>🍯 Miodowa Ortografia</h1>

    <div class="stats">
      <div>🍯 Miód: <span id="honey">0</span></div>
      <div>❤️ Życia: <span id="lives">3</span></div>
      <div>❓ Pytanie: <span id="questionNumber">1</span></div>
      <div>📚 Etap: <span id="stageName">Ó / U</span></div>
    </div>

    <div class="event-bar">
      <strong>Aktywny event:</strong> <span id="activeEvent">Brak</span>
    </div>

    <div class="pet-bar">
      <strong>Zwierzątko:</strong> <span id="pet">Brak</span>
    </div>

    <div class="question-box">
      <h2 id="questionText">Ładowanie pytania...</h2>
      <div class="answers" id="answers"></div>
    </div>

    <div class="gold-box" id="goldBox" style="display:none;">
      ✨ Złota odpowiedź! Jeśli odpowiesz dobrze, dostaniesz zwierzątko!
    </div>

    <div class="cards-section" id="cardsSection" style="display:none;">
      <h3>Wybierz 1 z 3 kart</h3>
      <div class="cards" id="cards"></div>
    </div>

    <div class="message" id="message"></div>

    <button id="nextBtn" style="display:none;">Następne pytanie</button>
    <button id="restartBtn" style="display:none;">Zagraj od nowa</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
